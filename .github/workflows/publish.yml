name: publish

# Publishes on a version bump, with no token: npm authenticates the run itself through
# GitHub's OIDC provider (trusted publishing), which is what `id-token: write` below mints.
# The trusted publisher registered on npmjs.com names this file, so renaming it breaks
# publishing until the npm side is updated to match.
on:
  push:
    branches: [main]
    paths: ["package.json"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # WHY: OIDC publishing needs npm 11.5.1 or newer, which is ahead of what setup-node bundles.
      - run: npm install -g npm@latest
      - id: state
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "target=$name@$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.state.outputs.published == 'true'
        run: echo "${{ steps.state.outputs.target }} is already on npm; nothing to publish."
      - if: steps.state.outputs.published == 'false'
        run: npm publish
